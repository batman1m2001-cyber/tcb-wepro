[project]
name = "tcb-wepro"
version = "0.1.0"
description = "A chat service: one LLMOp on the llm:assistant model."
requires-python = ">=3.10"
dependencies = [
    "operonx[serve,openai]>=1.18.1",
    "python-dotenv>=1.0",  # operonx.bootstrap() reads .env with it
]

[project.optional-dependencies]
test = [  # pip: pip install -e ".[test]"
    "pytest>=8",
    "httpx>=0.24",  # starlette's TestClient
]

[dependency-groups]
dev = ["tcb-wepro[test]"]  # uv: `uv sync` installs the test extra too

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "."]  # the features and `app` are first-party
extend-exclude = [".operonx"]  # generated: the guides `operonx guide` copies in

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_kb.py" = ["E501"]  # document titles and summaries are data
